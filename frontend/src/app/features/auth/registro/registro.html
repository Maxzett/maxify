<div class="pantalla">
  <div class="contenedor">
    <div class="encabezado">
      <a class="logo" routerLink="/login">Maxify</a>
      <span>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></span>
    </div>

    <section class="tarjeta formulario">
      <h1>Crear cuenta</h1>
      <p class="subtitulo">Completá tus datos para empezar a publicar.</p>

      <app-formulario-usuario
        modo="registro"
        textoEnviar="Crear cuenta"
        rutaCancelar="/login"
        [cargando]="cargando()"
        (enviar)="crearCuenta($event)"
        (invalido)="avisarErrores()"
      />
    </section>
  </div>
</div>
